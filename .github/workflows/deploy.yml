name: Deploy Theme to Strato

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.su635654 }}
          server: ${{ secrets.5020645575.ssh.w2.strato.hosting }}
          port: 22
          password: ${{ secrets.Marillion1* }}
          local_path: './*'
          remote_path: '/home/www/public/wp-content/themes/Frater-thema'
          delete_remote_files: true;