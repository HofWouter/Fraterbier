name: Deploy Craft-site naar Strato

# Alleen handmatig starten (Actions > Deploy > Run workflow).
# Benodigde secrets: SERVER_HOST, SERVER_USERNAME, SERVER_PASSWORD, SFTP_REMOTE_PATH
# SFTP_REMOTE_PATH = de map van het Craft-project op de server (de map BOVEN public_html/).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Composer-dependencies installeren
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CSS bouwen (Tailwind)
        run: npm ci && npm run build && rm -rf node_modules

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SERVER_USERNAME }}
          server: ${{ secrets.SERVER_HOST }}
          port: 22
          password: ${{ secrets.SERVER_PASSWORD }}
          local_path: './*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          # Niet verwijderen: anders verdwijnen .env, storage/ en public_html/uploads/ op de server
          delete_remote_files: false

      # Na het uploaden moet `php craft up` op de server draaien (via SSH of het
      # Strato-controlepaneel) om migraties en project config toe te passen.
