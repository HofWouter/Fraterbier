name: Deploy Theme to Strato

on:
  push:
    branches:
      - main # Verander dit naar 'master' als jouw hoofdtak zo heet

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './*' # Uploadt alles uit je git-repository
          remote_path: '/home/www/public/wp-content/themes/Frater-thema'
          delete_remote_files: true;
          