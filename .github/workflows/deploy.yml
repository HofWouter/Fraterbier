name: Deploy Craft-site naar server

# Start automatisch bij elke push naar main, of handmatig (Actions > Deploy > Run workflow).
# Benodigde secrets: SERVER_HOST, SERVER_USERNAME, SERVER_SSH_KEY, SFTP_REMOTE_PATH
# Optioneel: SERVER_PORT (standaard 22).
# SFTP_REMOTE_PATH = de map van het Craft-project op de server (de map BOVEN public_html/).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.ddev/**'
  workflow_dispatch:

# Nooit twee deploys tegelijk: een nieuwe push wacht tot de lopende deploy klaar is.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Composer-dependencies installeren
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CSS bouwen (Tailwind)
        run: npm ci && npm run build && rm -rf node_modules

      - name: SSH-sleutel instellen
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # rsync stuurt alleen gewijzigde bestanden (ook in vendor/). Er wordt niets op de
      # server verwijderd, dus .env, storage/ en public_html/uploads/ blijven staan.
      # Wil je dat lokaal verwijderde bestanden ook op de server verdwijnen, voeg dan
      # --delete-after toe (de uitgesloten mappen blijven dan nog steeds staan).
      - name: Deploy via rsync (SSH)
        env:
          TARGET: ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          rsync -az --no-perms --omit-dir-times --itemize-changes \
            -e "ssh -p $SERVER_PORT" \
            --exclude='.git/' --exclude='.github/' --exclude='.ddev/' \
            --exclude='node_modules/' --exclude='/storage/' \
            --exclude='/public_html/uploads/' --exclude='/public_html/cpresources/' \
            --exclude='/.env' --exclude='.DS_Store' \
            ./ "$TARGET:${REMOTE_PATH%/}/"

      - name: Craft migraties en project config toepassen
        env:
          TARGET: ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: ssh -p "$SERVER_PORT" "$TARGET" "cd '${REMOTE_PATH%/}' && php craft up --interactive=0"
